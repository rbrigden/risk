[package]
name = "riskbot"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

earcutr = { version = "0.5", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
burn = { version = "0.20", optional = true, features = ["wgpu", "ndarray", "autodiff", "vulkan", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

[features]
visualizer = ["dep:eframe", "dep:earcutr", "dep:serde", "dep:serde_json", "dep:burn", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
train = ["dep:burn", "dep:serde", "dep:serde_json"]
arena-wasm = ["dep:serde", "dep:serde_json", "dep:wasm-bindgen"]

[[bin]]
name = "riskbot-visualizer"
required-features = ["visualizer"]

[[bin]]
name = "riskbot-dashboard"
required-features = ["visualizer"]

[[bin]]
name = "riskbot-web"
required-features = ["visualizer"]

[[bin]]
name = "riskbot-train"
required-features = ["train"]

[[bin]]
name = "riskbot-export"
required-features = ["visualizer"]
