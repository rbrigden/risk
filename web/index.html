<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riskbot</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #141d27; color: #e9f1f6; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="board" aria-label="Riskbot strategy board"></canvas>
  <div id="status" role="status">Loading Riskbot…</div>
  <script type="module">

    const status = document.querySelector('#status');
    try {
      const { default: init, start } = await import('./riskbot.js');
      await init();
      await start(document.querySelector('#board'));
      status.hidden = true;
    } catch (error) {
      status.textContent = `Riskbot could not start: ${error}`;
      console.error(error);
    }
  </script>
</body>
</html>
